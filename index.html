<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Plan tasks by importance, time, and due date." />
    <meta name="theme-color" content="#6750A4" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <title>Lists</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon92.png
    <link rel="stylesheet" href="./styles.css?v=1" />
  </head>
  <body>
    <div id="app">
      <header class="top-app-bar">
        <div class="bar-title">
          <h1>Lists</h1>
          <p id="sort-caption" class="sort-caption">Manual order</p>
        </div>
        <div class="bar-actions">
          <button type="button" id="btn-filter" class="icon-btn" aria-label="Sort and filters">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M10 18h4v-2h-4v2ZM3 6v2h18V6H3Zm3 7h12v-2H6v2Z"
              />
            </svg>
          </button>
          <button type="button" id="btn-theme" class="icon-btn" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 22a10 10 0 0 1 0-20 1.5 1.5 0 0 1 .3 3A7 7 0 1 0 19 11.7 1.5 1.5 0 0 1 22 12a10 10 0 0 1-10 10Z"
              />
            </svg>
          </button>
        </div>
      </header>

      <nav class="tabs" id="category-tabs" aria-label="Categories"></nav>

      <main id="task-list" class="task-list" aria-live="polite"></main>

      <button type="button" id="fab" class="fab" aria-label="Add task">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2Z" />
        </svg>
      </button>
    </div>

    <div id="scrim" class="scrim" hidden></div>

    <section id="sheet-filter" class="sheet" role="dialog" aria-modal="true" aria-labelledby="filter-title" hidden>
      <div class="sheet-handle"></div>
      <h2 id="filter-title">Sort &amp; filters</h2>
      <p class="sheet-note">Manual order is restored when you return to Manual Order.</p>
      <form id="filter-form" class="choice-list">
        <label class="choice">
          <input type="radio" name="sortMode" value="manual" />
          <span>Manual order</span>
        </label>
        <label class="choice">
          <input type="radio" name="sortMode" value="importance" />
          <span>Sort by importance</span>
        </label>
        <label class="choice">
          <input type="radio" name="sortMode" value="time" />
          <span>Sort by estimated time</span>
        </label>
        <label class="choice">
          <input type="radio" name="sortMode" value="quickWins" />
          <span>Quick wins</span>
        </label>
        <label class="choice">
          <input type="radio" name="sortMode" value="due7" />
          <span>Due next 7 days</span>
        </label>
        <label class="choice switch-row">
          <span>Hide completed</span>
          <input type="checkbox" id="hide-completed" />
        </label>
      </form>
    </section>

    <section id="sheet-task-actions" class="sheet" role="dialog" aria-labelledby="task-actions-title" hidden>
      <div class="sheet-handle"></div>
      <h2 id="task-actions-title">Task</h2>
      <div class="action-list">
        <button type="button" data-action="edit">Edit</button>
        <button type="button" data-action="complete">Complete</button>
        <button type="button" data-action="delete" class="danger">Delete</button>
      </div>
    </section>

    <section id="sheet-category-actions" class="sheet" role="dialog" aria-labelledby="cat-actions-title" hidden>
      <div class="sheet-handle"></div>
      <h2 id="cat-actions-title">Category</h2>
      <div class="action-list">
        <button type="button" data-action="rename">Rename</button>
        <button type="button" data-action="delete" class="danger">Delete</button>
      </div>
    </section>

    <section id="dialog-task" class="dialog" role="dialog" aria-labelledby="task-dialog-title" hidden>
      <form id="task-form">
        <h2 id="task-dialog-title">Add task</h2>
        <label>
          Name
          <input type="text" name="name" required maxlength="120" autocomplete="off" />
        </label>
        <label>
          Importance
          <input type="range" name="importance" min="1" max="5" step="1" value="3" />
          <span id="importance-value" class="hint">3</span>
        </label>
        <label>
          Estimated time (hours)
          <input type="number" name="estimatedTime" min="0.25" max="80" step="0.25" value="1" required />
        </label>
        <label>
          Due date
          <input type="date" name="dueDate" />
        </label>
        <label>
          Category
          <select name="categoryId"></select>
        </label>
        <div class="dialog-actions">
          <button type="button" id="task-cancel" class="btn-text">Cancel</button>
          <button type="submit" class="btn-filled">Save</button>
        </div>
      </form>
    </section>

    <section id="dialog-category" class="dialog" role="dialog" aria-labelledby="cat-dialog-title" hidden>
      <form id="category-form">
        <h2 id="cat-dialog-title">New category</h2>
        <label>
          Name
          <input type="text" name="name" required maxlength="40" autocomplete="off" />
        </label>
        <div class="dialog-actions">
          <button type="button" id="category-cancel" class="btn-text">Cancel</button>
          <button type="submit" class="btn-filled">Save</button>
        </div>
      </form>
    </section>

    <section id="dialog-confirm" class="dialog" role="alertdialog" aria-labelledby="confirm-title" hidden>
      <h2 id="confirm-title">Delete?</h2>
      <p id="confirm-message">This cannot be undone.</p>
      <div class="dialog-actions">
        <button type="button" id="confirm-cancel" class="btn-text">Cancel</button>
        <button type="button" id="confirm-ok" class="btn-filled danger">Delete</button>
      </div>
    </section>

    <script src="./app.js?v=1" defer></script>
  </body>
</html>
